    <!-- ============================================================
         ЗАСТАВКА ПРИ ОТКРЫТИИ
         Живёт в статическом HTML, поэтому рисуется мгновенно — ещё до
         загрузки React. Контент сайта всё это время уже лежит в разметке
         под ней, так что индексации она не мешает. Уходит сама даже
         без JavaScript: скрытие задано CSS-анимацией.
         ============================================================ -->
    <style>
      #aa-intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        animation: aaIntroEnd 0.01s linear 2.75s forwards;
      }

      #aa-intro .aa-curtain {
        position: absolute;
        left: 0;
        right: 0;
        height: 50.5%;
        background: #fbf8f3;
      }

      #aa-intro .aa-curtain--t {
        top: 0;
        animation: aaCurtainUp 0.85s cubic-bezier(0.76, 0, 0.24, 1) 1.95s forwards;
      }

      #aa-intro .aa-curtain--b {
        bottom: 0;
        animation: aaCurtainDown 0.85s cubic-bezier(0.76, 0, 0.24, 1) 1.95s forwards;
      }

      /* Золотая нить на стыке «штор» — расходится вместе с ними */
      #aa-intro .aa-seam {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #b0872a, transparent);
        transform: translate(-50%, -50%);
        animation: aaSeam 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards,
                   aaSeamOut 0.5s ease 1.95s forwards;
      }

      #aa-intro .aa-stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        perspective: 900px;
        animation: aaStageOut 0.6s ease 1.9s forwards;
      }

      #aa-intro .aa-mark {
        width: 148px;
        height: 148px;
        color: #15181c;
        transform-style: preserve-3d;
        animation: aaMark3d 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        filter: drop-shadow(0 14px 26px rgba(20, 24, 30, 0.14));
      }

      #aa-intro .aa-type {
        text-align: center;
        line-height: 1;
      }

      #aa-intro .aa-word {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        color: #15181c;
        opacity: 0;
        animation: aaRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
      }

      #aa-intro .aa-sub {
        margin-top: 0.6rem;
        font-family: Inter, system-ui, sans-serif;
        font-size: 0.7rem;
        font-weight: 500;
        color: #b0872a;
        opacity: 0;
        animation: aaSpread 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.18s forwards;
      }

      #aa-intro .aa-draw {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }

      #aa-intro .aa-ring-1 { animation: aaDraw 1s cubic-bezier(0.65, 0, 0.35, 1) 0.05s forwards; }
      #aa-intro .aa-ring-2 { animation: aaDraw 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.45s forwards; }
      #aa-intro .aa-letter  { animation: aaDraw 0.85s cubic-bezier(0.65, 0, 0.35, 1) 0.4s forwards; }

      #aa-intro .aa-bar {
        transform-box: fill-box;
        transform-origin: bottom;
        transform: scaleY(0);
      }

      #aa-intro .aa-bar-1 { animation: aaBar 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) 0.95s forwards; }
      #aa-intro .aa-bar-2 { animation: aaBar 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) 1.06s forwards; }
      #aa-intro .aa-bar-3 { animation: aaBar 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) 1.17s forwards; }

      @keyframes aaMark3d {
        from { transform: rotateY(-48deg) rotateX(14deg) scale(0.84); opacity: 0; }
        to   { transform: rotateY(0) rotateX(0) scale(1); opacity: 1; }
      }

      @keyframes aaDraw { to { stroke-dashoffset: 0; } }
      @keyframes aaBar  { to { transform: scaleY(1); } }

      @keyframes aaRise {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: none; }
      }

      @keyframes aaSpread {
        from { opacity: 0; letter-spacing: 1.1em; }
        to   { opacity: 1; letter-spacing: 0.42em; }
      }

      @keyframes aaSeam {
        from { width: 0; opacity: 0; }
        to   { width: min(420px, 62vw); opacity: 1; }
      }

      @keyframes aaSeamOut { to { opacity: 0; } }
      @keyframes aaStageOut { to { opacity: 0; transform: translateY(-14px) scale(1.05); } }
      @keyframes aaCurtainUp { to { transform: translateY(-101%); } }
      @keyframes aaCurtainDown { to { transform: translateY(101%); } }
      @keyframes aaIntroEnd { to { visibility: hidden; pointer-events: none; } }

      html.dark #aa-intro .aa-curtain { background: #0d0e10; }
      html.dark #aa-intro .aa-mark { color: #f6f2ea; filter: none; }
      html.dark #aa-intro .aa-word { color: #f6f2ea; }
      html.dark #aa-intro .aa-sub { color: #d4af37; }

      /* Пока идёт заставка, страница под ней не прокручивается */
      html.aa-intro-lock, html.aa-intro-lock body { overflow: hidden; }

      @media (min-width: 640px) {
        #aa-intro .aa-mark { width: 190px; height: 190px; }
        #aa-intro .aa-word { font-size: 2.6rem; }
        #aa-intro .aa-sub { font-size: 0.8rem; }
      }

      /* Кому анимация мешает — заставки нет вообще */
      @media (prefers-reduced-motion: reduce) {
        #aa-intro { display: none; }
      }
    </style>

    <div id="aa-intro" aria-hidden="true">
      <div class="aa-curtain aa-curtain--t"></div>
      <div class="aa-curtain aa-curtain--b"></div>
      <div class="aa-seam"></div>

      <div class="aa-stage">
        <svg class="aa-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="aaGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ecd79f" />
              <stop offset="34%" stop-color="#b0872a" />
              <stop offset="62%" stop-color="#8b6a1d" />
              <stop offset="100%" stop-color="#e4c67c" />
            </linearGradient>
          </defs>
          <path class="aa-draw aa-ring-1" pathLength="1" d="M36.4 8.6a19 19 0 1 1-26.6 3.3"
                stroke="url(#aaGold)" stroke-width="1.7" stroke-linecap="round" />
          <path class="aa-draw aa-ring-2" pathLength="1" d="M11.6 39.4A19 19 0 0 0 40 24"
                stroke="url(#aaGold)" stroke-width="1.7" stroke-linecap="round" opacity="0.5" />
          <path class="aa-draw aa-letter" pathLength="1" d="M14 36 24 12l10 24"
                stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
          <rect class="aa-bar aa-bar-1" x="18.6" y="29.4" width="2.4" height="4.2" fill="url(#aaGold)" />
          <rect class="aa-bar aa-bar-2" x="22.8" y="26.6" width="2.4" height="7" fill="url(#aaGold)" />
          <rect class="aa-bar aa-bar-3" x="27" y="23.4" width="2.4" height="10.2" fill="url(#aaGold)" />
        </svg>

        <div class="aa-type">
          <div class="aa-word">ADVANCED</div>
          <div class="aa-sub">AUDIT</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var intro = document.getElementById('aa-intro');
        if (!intro) return;

        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = null;
        try { seen = sessionStorage.getItem('aa-intro-seen'); } catch (e) { /* приватный режим */ }

        // Повторным переходам внутри сессии заставка только мешает
        if (reduced || seen) {
          intro.remove();
          return;
        }

        try { sessionStorage.setItem('aa-intro-seen', '1'); } catch (e) {}

        var root = document.documentElement;
        root.classList.add('aa-intro-lock');

        var finish = function () {
          root.classList.remove('aa-intro-lock');
          if (intro.parentNode) intro.remove();
        };

        setTimeout(finish, 2900);
        // Заставку можно пропустить касанием или клавишей
        intro.addEventListener('click', finish);
        window.addEventListener('keydown', finish, { once: true });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
